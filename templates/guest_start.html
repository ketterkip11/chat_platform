{% extends "base.html" %}

{% block title %}Start a Chat{% endblock %}

{% block content %}
<div class="page-narrow">
    <form class="card" method="post" action="{% url 'guest_start' %}">
        {% csrf_token %}
        <h1>Welcome to Support</h1>
        <p style="color: var(--muted); font-size: 0.9rem; margin-top: -0.5rem; margin-bottom: 1.5rem;">
            Please enter your name and email to start chatting with an agent.
        </p>

        {% if error %}
            <ul class="errorlist">
                <li>{{ error }}</li>
            </ul>
        {% endif %}

        <p class="field">
            <label for="id_name">Name</label>
            <input type="text" name="name" id="id_name" required autofocus placeholder="e.g. Jane Doe">
        </p>

        <p class="field">
            <label for="id_email">Email address</label>
            <input type="email" name="email" id="id_email" required placeholder="jane@example.com">
        </p>

        <button class="btn" type="submit" style="margin-top: 0.5rem;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            Start Chat
        </button>
        
        <p class="helper-link">Have an account? <a href="{% url 'login' %}">Log in</a></p>
    </form>
</div>
{% endblock %}
